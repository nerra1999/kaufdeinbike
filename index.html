<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaufDeinBike — Motorrad Marktplatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --asphalt:#15161a; --asphalt-2:#202228; --steel:#3a3e46;
    --chrome:#c7ccd3; --paper:#f1efe9; --accent:#ff5b1f; --accent-dim:#c9481a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--asphalt);font-family:'IBM Plex Sans',sans-serif;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}

  header{background:var(--asphalt);color:var(--paper);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--accent);}
  .logo span{font-family:'Oswald';font-weight:700;font-size:22px;}
  .logo span em{color:var(--accent);font-style:normal;}
  .header-left{display:flex;align-items:center;gap:18px;}
  .tacho{width:52px;height:52px;flex-shrink:0;}
  .tacho .needle{
    transform-origin:50px 50px;
    animation:idle-rev 1.8s ease-in-out infinite;
  }
  @keyframes idle-rev{
    0%   { transform:rotate(-35deg); }
    15%  { transform:rotate(20deg); }
    30%  { transform:rotate(-15deg); }
    45%  { transform:rotate(35deg); }
    60%  { transform:rotate(-5deg); }
    75%  { transform:rotate(15deg); }
    100% { transform:rotate(-35deg); }
  }
  @media (prefers-reduced-motion:reduce){
    .tacho .needle{animation:none;transform:rotate(-10deg);}
  }
  .auth-area{display:flex;align-items:center;gap:12px;font-size:14px;}
  .btn{padding:9px 18px;font-weight:600;font-size:14px;border:none;cursor:pointer;letter-spacing:0.02em;}
  .btn-accent{background:var(--accent);color:var(--asphalt);}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid var(--chrome);}

  .search-panel{
    background:var(--paper);max-width:1280px;margin:24px auto 0;padding:20px 24px;
    border:1px solid var(--steel);display:flex;gap:14px;flex-wrap:wrap;
  }
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--steel);font-weight:600;}
  .field select,.field input{border:1.5px solid var(--asphalt);background:transparent;padding:9px 10px;font-family:'IBM Plex Sans';font-size:14px;}
  .search-panel .btn-search{align-self:flex-end;background:var(--asphalt);color:var(--paper);padding:10px 24px;font-weight:600;font-size:14px;border:none;cursor:pointer;}
  .search-panel .btn-reset{align-self:flex-end;background:transparent;color:var(--asphalt);padding:10px 16px;font-weight:600;font-size:13px;border:1.5px solid var(--asphalt);cursor:pointer;}
  #extraFilters{display:none;}
  #extraFilters.open{display:flex;}

  .listings{padding:40px 32px 80px;max-width:1280px;margin:0 auto;}
  .listings-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
  .card{background:#fff;border:1px solid #ddd8cd;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 8px 20px rgba(21,22,26,0.12);}
  .card-media{height:170px;background:#e5e1d5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .card-media img{width:100%;height:100%;object-fit:cover;}
  .photo-count{position:absolute;bottom:8px;right:8px;background:rgba(21,22,26,0.75);color:#fff;font-size:11px;padding:3px 8px;font-family:'JetBrains Mono';}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:17px;}
  .specs{display:flex;gap:12px;flex-wrap:wrap;font-family:'JetBrains Mono';font-size:12px;color:var(--steel);}
  .price-row{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed #ddd8cd;}
  .price{font-family:'JetBrains Mono';font-weight:700;font-size:19px;}
  .empty{color:var(--steel);font-size:14px;padding:40px 0;}

  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(21,22,26,0.6);z-index:100;align-items:center;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--paper);width:min(520px,92vw);max-height:88vh;overflow:auto;padding:28px;border-top:4px solid var(--accent);}
  .modal h2{font-size:22px;margin-bottom:18px;}
  .modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;color:var(--steel);margin-top:12px;margin-bottom:5px;}
  .modal input,.modal select,.modal textarea{width:100%;border:1.5px solid var(--asphalt);padding:9px;font-family:'IBM Plex Sans';font-size:14px;background:transparent;}
  .modal textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-cancel{background:transparent;border:1.5px solid var(--asphalt);}
  .msg{font-size:13px;margin-top:10px;}
  .msg.err{color:#c0392b;}
  .msg.ok{color:#1e7e34;}

  /* Detail-Modal */
  .detail-modal{background:var(--paper);width:min(720px,94vw);max-height:90vh;overflow:auto;padding:0;border-top:4px solid var(--accent);}
  .detail-gallery{display:flex;gap:8px;overflow-x:auto;padding:0;}
  .detail-gallery img{width:100%;max-height:380px;object-fit:cover;flex-shrink:0;scroll-snap-align:start;}
  .detail-gallery{scroll-snap-type:x mandatory;}
  .detail-thumbs{display:flex;gap:6px;padding:10px 24px 0;flex-wrap:wrap;}
  .detail-thumbs img{width:56px;height:56px;object-fit:cover;border:1.5px solid var(--steel);cursor:pointer;}
  .detail-body{padding:20px 24px 28px;}
  .detail-body h2{font-size:24px;margin-bottom:4px;}
  .detail-specs{display:flex;gap:16px;flex-wrap:wrap;font-family:'JetBrains Mono';font-size:13px;color:var(--steel);margin:10px 0 16px;padding-bottom:16px;border-bottom:1px dashed #ddd8cd;}
  .detail-price{font-family:'JetBrains Mono';font-weight:700;font-size:26px;color:var(--accent-dim);}
  .detail-desc{margin-top:14px;line-height:1.6;white-space:pre-wrap;}
  .existing-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .existing-thumbs img{width:60px;height:60px;object-fit:cover;border:1.5px solid var(--steel);}

  /* ===== Mobile ===== */
  @media (max-width:640px){
    header{padding:12px 16px;flex-wrap:wrap;gap:10px;}
    .header-left{gap:10px;}
    .tacho{width:38px;height:38px;}
    .logo span{font-size:17px;}
    .auth-area{width:100%;flex-wrap:wrap;gap:8px;font-size:12px;}
    .auth-area span{width:100%;font-size:12px;word-break:break-all;}
    .btn{padding:8px 12px;font-size:12.5px;flex:1;min-width:0;white-space:nowrap;}

    .search-panel{margin:16px 12px 0;padding:14px;gap:10px;}
    #extraFilters{margin-top:10px;}
    #extraFilters .field{border-bottom:1px solid #ece8de;padding-bottom:10px;}
    .field{min-width:100%;}
    .search-panel .btn-search,.search-panel .btn-reset{flex:1;align-self:stretch;padding:11px;}

    .listings{padding:28px 16px 60px;}
    .listings-head h2{font-size:20px;}
    .grid{grid-template-columns:1fr;gap:16px;}

    .modal{width:94vw;padding:20px;}
    .modal-actions{flex-direction:column;}
    .modal-actions .btn{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo"><span>KaufDeinBike<em>.</em></span></div>
  </div>
  <div class="auth-area" id="authArea"><!-- wird per JS befüllt --></div>
</header>

<div class="search-panel" id="smartSearchPanel" style="max-width:1280px;margin:24px auto 0;">
  <div class="field" style="flex:3;">
    <label for="smartSearch">🔎 Intelligente Suche</label>
    <input type="text" id="smartSearch" placeholder="z. B. Honda 120 PS 820 Sitzhöhe unfallfrei">
  </div>
  <button class="btn-search" id="smartSearchBtn" type="button">Suchen</button>
</div>

<form class="search-panel" id="filterForm" onsubmit="return false;">
  <div class="field">
    <label for="fil_marke">Marke</label>
    <select id="fil_marke" onchange="updateFilterModellOptions()">
      <option value="">Alle Marken</option>
    </select>
  </div>
  <div class="field">
    <label for="fil_modell">Modell</label>
    <select id="fil_modell">
      <option value="">Alle Modelle</option>
    </select>
  </div>
  <div class="field">
    <label for="fil_typ">Fahrzeugtyp</label>
    <select id="fil_typ">
      <option value="">Alle Typen</option>
      <option>Naked Bike</option><option>Reiseenduro</option>
      <option>Sportler</option><option>Cruiser</option><option>Roller</option>
    </select>
  </div>
  <div class="field">
    <label for="fil_preis">Preis (€)</label>
    <input type="number" id="fil_preis" placeholder="z. B. 8000">
  </div>
  <div class="field">
    <label for="fil_km">Kilometerstand</label>
    <input type="number" id="fil_km" placeholder="z. B. 20000">
  </div>
  <div class="field">
    <label for="fil_ort">Ort</label>
    <input type="text" id="fil_ort" placeholder="z. B. Augsburg">
  </div>
  <button class="btn-search" id="fil_search">Suchen</button>
  <button class="btn-reset" id="fil_reset" type="button">Zurücksetzen</button>
  <button class="btn-reset" type="button" onclick="document.getElementById('extraFilters').classList.toggle('open')">Erweiterte Filter</button>
</form>

<div class="search-panel" id="extraFilters" style="max-width:1280px;margin:0 auto;border-top:none;">
  <div class="field">
    <label for="fil_ps_von">PS von</label>
    <input type="number" id="fil_ps_von" placeholder="z. B. 50">
  </div>
  <div class="field">
    <label for="fil_ps_bis">PS bis</label>
    <input type="number" id="fil_ps_bis" placeholder="z. B. 150">
  </div>
  <div class="field">
    <label for="fil_gewicht">Gewicht (kg)</label>
    <input type="number" id="fil_gewicht" placeholder="z. B. 220">
  </div>
  <div class="field">
    <label for="fil_zylinder">Zylinderzahl</label>
    <input type="number" id="fil_zylinder" placeholder="z. B. 4">
  </div>
  <div class="field">
    <label for="fil_drehmoment">Drehmoment (Nm)</label>
    <input type="number" id="fil_drehmoment" placeholder="z. B. 100">
  </div>
  <div class="field">
    <label for="fil_sitzhoehe">Sitzhöhe (cm)</label>
    <input type="number" id="fil_sitzhoehe" placeholder="z. B. 820">
  </div>
  <div class="field">
    <label for="fil_antrieb">Antriebsart</label>
    <select id="fil_antrieb">
      <option value="">Alle</option><option>Kette</option><option>Riemen</option><option>Kardan</option>
    </select>
  </div>
  <div class="field">
    <label for="fil_baujahr_von">Erstzulassung von</label>
    <input type="number" id="fil_baujahr_von" placeholder="z. B. 2015">
  </div>
  <div class="field">
    <label for="fil_baujahr_bis">Erstzulassung bis</label>
    <input type="number" id="fil_baujahr_bis" placeholder="z. B. 2024">
  </div>
  <div class="field">
    <label for="fil_fsklasse">Führerscheinklasse</label>
    <select id="fil_fsklasse">
      <option value="">Alle</option><option>A1</option><option>A2</option><option>A</option>
    </select>
  </div>
  <div class="field">
    <label for="fil_verkaeufertyp">Verkäufer-Typ</label>
    <select id="fil_verkaeufertyp">
      <option value="">Alle</option><option>Privat</option><option>Händler</option>
    </select>
  </div>
  <div class="field">
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <input type="checkbox" id="fil_unfallfrei" style="width:auto;"> Nur unfallfrei
    </label>
  </div>
  <div class="field">
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <input type="checkbox" id="fil_scheckheft" style="width:auto;"> Nur scheckheftgepflegt
    </label>
  </div>
</div>

<section class="listings">
  <div class="listings-head">
    <h2>Aktuelle Angebote</h2>
    <span class="count mono" id="count">lädt…</span>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- Login-Modal -->
<div class="modal-bg" id="loginModalBg">
  <div class="modal">
    <h2>Anmelden</h2>
    <label for="loginEmail">E-Mail</label>
    <input type="email" id="loginEmail" placeholder="du@example.com">
    <div class="msg" id="loginMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="loginSend">Code senden</button>
      <button class="btn btn-cancel" onclick="closeModal('loginModalBg')">Abbrechen</button>
    </div>

    <div id="otpStep" style="display:none;margin-top:18px;padding-top:18px;border-top:1px dashed #ddd8cd;">
      <label for="loginOtp">Code aus der E-Mail eingeben</label>
      <input type="text" id="loginOtp" placeholder="12345678" inputmode="numeric" maxlength="8">
      <div class="msg" id="otpMsg"></div>
      <div class="modal-actions">
        <button class="btn btn-accent" id="otpVerify">Code bestätigen</button>
      </div>
    </div>
  </div>
</div>

<!-- Meine Inserate Modal -->
<div class="modal-bg" id="myListingsModalBg">
  <div class="modal">
    <h2>Meine Inserate</h2>
    <div id="myListingsList" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" onclick="closeModal('myListingsModalBg')">Schließen</button>
    </div>
  </div>
</div>

<!-- Inserieren-Modal -->
<div class="modal-bg" id="insertModalBg">
  <div class="modal">
    <h2 id="insertModalTitle">Motorrad inserieren</h2>
    <form id="insertForm">
      <label>Marke</label>
      <select id="f_marke" required onchange="updateModellOptions()">
        <option value="">Bitte wählen</option>
      </select>
      <label>Modell</label>
      <select id="f_modell" required onchange="toggleModellSonstiges()">
        <option value="">Erst Marke wählen</option>
      </select>
      <input type="text" id="f_modell_sonstiges" placeholder="Modellname eingeben" style="display:none;margin-top:8px;">
      <label>Typ</label>
      <select id="f_typ">
        <option>Naked Bike</option><option>Reiseenduro</option>
        <option>Sportler</option>Cruiser<option>Roller</option>
      </select>
      <label>Baujahr</label>
      <input type="number" id="f_baujahr" required min="1950" max="2026">
      <label>Kilometerstand</label>
      <input type="number" id="f_km" required min="0">
      <label>Hubraum (ccm)</label>
      <input type="number" id="f_ccm" required min="0">
      <label>Preis (€)</label>
      <input type="number" id="f_preis" required min="0">
      <label>PLZ / Ort</label>
      <input type="text" id="f_ort" placeholder="86150 Augsburg">
      <label>Beschreibung</label>
      <textarea id="f_beschreibung"></textarea>

      <div style="margin-top:18px;padding-top:14px;border-top:1px dashed #ddd8cd;">
        <label style="margin-top:0;">Erweiterte Angaben (optional)</label>
      </div>
      <label>PS</label>
      <input type="number" id="f_ps" min="0">
      <label>Gewicht (kg)</label>
      <input type="number" id="f_gewicht" min="0">
      <label>Zylinderzahl</label>
      <input type="number" id="f_zylinder" min="0">
      <label>Drehmoment (Nm)</label>
      <input type="number" id="f_drehmoment" min="0">
      <label>Sitzhöhe (cm)</label>
      <input type="number" id="f_sitzhoehe" min="0">
      <label>Antriebsart</label>
      <select id="f_antriebsart">
        <option value="">Nicht angegeben</option>
        <option>Kette</option><option>Riemen</option><option>Kardan</option>
      </select>
      <label>Führerscheinklasse</label>
      <select id="f_fsklasse">
        <option value="">Nicht angegeben</option>
        <option>A1</option><option>A2</option><option>A</option>
      </select>
      <label>Verkäufer-Typ</label>
      <select id="f_verkaeufertyp">
        <option value="">Nicht angegeben</option>
        <option>Privat</option><option>Händler</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;">
        <input type="checkbox" id="f_unfallfrei" style="width:auto;"> Unfallfrei
      </label>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="f_scheckheft" style="width:auto;"> Scheckheftgepflegt
      </label>

      <label style="margin-top:18px;">Fotos (mehrere Auswahl möglich)</label>
      <div id="existingPhotos" class="existing-thumbs"></div>
      <input type="file" id="f_bild" accept="image/*" multiple>
      <div class="msg" id="insertMsg"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-accent" id="insertSubmitBtn">Inserat veröffentlichen</button>
        <button type="button" class="btn btn-cancel" onclick="editingId=null;closeModal('insertModalBg')">Abbrechen</button>
      </div>
    </form>
  </div>
</div>

<!-- Detail-Modal -->
<div class="modal-bg" id="detailModalBg">
  <div class="detail-modal" id="detailModalContent"></div>
</div>

<!-- Kontakt-Modal -->
<div class="modal-bg" id="contactModalBg">
  <div class="modal">
    <h2>Nachricht an den Verkäufer</h2>
    <label for="contactText">Deine Nachricht</label>
    <textarea id="contactText" placeholder="Hallo, ist das Motorrad noch verfügbar?"></textarea>
    <div class="msg" id="contactMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-accent" id="contactSend">Senden</button>
      <button class="btn btn-cancel" type="button" onclick="closeModal('contactModalBg')">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Nachrichten-Modal -->
<div class="modal-bg" id="messagesModalBg">
  <div class="modal">
    <h2>Nachrichten</h2>
    <div id="messagesList" style="display:flex;flex-direction:column;gap:12px;margin-top:16px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" onclick="closeModal('messagesModalBg')">Schließen</button>
    </div>
  </div>
</div>

<script src="config.js"></script>

function fuelleMarkenSelect(selectId){
  const select = document.getElementById(selectId);
  Object.keys(MODELLE_DB).sort().forEach(marke => {
    const opt = document.createElement('option');
    opt.value = marke; opt.textContent = marke;
    select.appendChild(opt);
  });
}
fuelleMarkenSelect('f_marke');

function updateModellOptions(){
  const marke = document.getElementById('f_marke').value;
  const select = document.getElementById('f_modell');
  select.innerHTML = '<option value="">Bitte wählen</option>';
  (MODELLE_DB[marke] || []).forEach(m => {
    const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
    select.appendChild(opt);
  });
  const sonst = document.createElement('option');
  sonst.value = '__sonstiges__'; sonst.textContent = 'Sonstiges (manuell eingeben)';
  select.appendChild(sonst);
  document.getElementById('f_modell_sonstiges').style.display = 'none';
}

function toggleModellSonstiges(){
  const isSonstiges = document.getElementById('f_modell').value === '__sonstiges__';
  document.getElementById('f_modell_sonstiges').style.display = isSonstiges ? 'block' : 'none';
}

function updateFilterModellOptions(){

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function openCreateModal(){
  editingId = null;
  document.getElementById('insertForm').reset();
  document.getElementById('existingPhotos').innerHTML = '';
  document.getElementById('insertModalTitle').textContent = "Motorrad inserieren";
  document.getElementById('insertSubmitBtn').textContent = "Inserat veröffentlichen";
  openModal('insertModalBg');
}

function openEditModal(listing){
  editingId = listing.id;
  document.getElementById('f_marke').value = listing.marke;
  updateModellOptions();
  const modellOptions = [...document.getElementById('f_modell').options].map(o => o.value);
  if(modellOptions.includes(listing.modell)){
    document.getElementById('f_modell').value = listing.modell;
    document.getElementById('f_modell_sonstiges').style.display = 'none';
  } else {
    document.getElementById('f_modell').value = '__sonstiges__';
    document.getElementById('f_modell_sonstiges').style.display = 'block';
    document.getElementById('f_modell_sonstiges').value = listing.modell;
  }
  document.getElementById('f_typ').value = listing.typ;
  document.getElementById('f_baujahr').value = listing.baujahr;
  document.getElementById('f_km').value = listing.km;
  document.getElementById('f_ccm').value = listing.ccm;
  document.getElementById('f_preis').value = listing.preis;
  document.getElementById('f_ort').value = listing.ort || '';
  document.getElementById('f_beschreibung').value = listing.beschreibung || '';
  document.getElementById('f_ps').value = listing.ps || '';
  document.getElementById('f_gewicht').value = listing.gewicht || '';
  document.getElementById('f_zylinder').value = listing.zylinder || '';
  document.getElementById('f_drehmoment').value = listing.drehmoment || '';
  document.getElementById('f_sitzhoehe').value = listing.sitzhoehe || '';
  document.getElementById('f_antriebsart').value = listing.antriebsart || '';
  document.getElementById('f_fsklasse').value = listing.fs_klasse || '';
  document.getElementById('f_verkaeufertyp').value = listing.verkaeufer_typ || '';
  document.getElementById('f_unfallfrei').checked = !!listing.unfallfrei;
  document.getElementById('f_scheckheft').checked = !!listing.scheckheft;
  document.getElementById('insertModalTitle').textContent = "Inserat bearbeiten";
  document.getElementById('insertSubmitBtn').textContent = "Änderungen speichern";
  const bilder = listing.bilder && listing.bilder.length ? listing.bilder : (listing.bild_url ? [listing.bild_url] : []);
  document.getElementById('existingPhotos').innerHTML = bilder.length
    ? bilder.map(url => `<img src="${url}">`).join('') + `<span style="font-size:11px;color:var(--steel);align-self:center;">Neue Fotos werden ergänzt, nicht ersetzt</span>`
    : '';
  closeModal('myListingsModalBg');
  openModal('insertModalBg');
}

async function openMyListings(){
  const list = document.getElementById('myListingsList');
  list.innerHTML = "Lädt…";
  const { data, error } = await supabaseClient
    .from('listings')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if(error){ list.innerHTML = `<p class="empty">Fehler: ${error.message}</p>`; openModal('myListingsModalBg'); return; }
  if(!data.length){ list.innerHTML = `<p class="empty">Du hast noch keine Inserate.</p>`; openModal('myListingsModalBg'); return; }

  list.innerHTML = data.map(b => `
    <div style="border:1px solid #ddd8cd;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div>
        <strong>${b.marke} ${b.modell}</strong><br>
        <span class="mono" style="font-size:12px;color:var(--steel)">${Number(b.preis).toLocaleString('de-DE')} € · ${b.status}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost" style="color:var(--asphalt);border-color:var(--asphalt);padding:6px 10px;font-size:12px;" onclick='openEditModal(${JSON.stringify(b).replace(/'/g,"&apos;")})'>Bearbeiten</button>
        ${b.status === 'aktiv'
          ? `<button class="btn btn-ghost" style="color:var(--asphalt);border-color:var(--asphalt);padding:6px 10px;font-size:12px;" onclick="markAsSold('${b.id}')">Als verkauft markieren</button>`
          : ''}
        <button class="btn" style="background:#c0392b;color:#fff;padding:6px 10px;font-size:12px;" onclick="deleteListing('${b.id}')">Löschen</button>
      </div>
    </div>
  `).join('');
  openModal('myListingsModalBg');
}

async function markAsSold(id){
  const { error } = await supabaseClient.from('listings').update({ status: 'verkauft' }).eq('id', id);
  if(error){ alert("Fehler: " + error.message); return; }
  openMyListings();
  loadListings();
}

async function deleteListing(id){
  if(!confirm("Inserat wirklich unwiderruflich löschen?")) return;
  const { error } = await supabaseClient.from('listings').delete().eq('id', id);
  if(error){ alert("Fehler: " + error.message); return; }
  openMyListings();
  loadListings();
}

let contactListingId = null;
let contactEmpfaengerId = null;

function openContactModal(listingId, empfaengerId){
  contactListingId = listingId;
  contactEmpfaengerId = empfaengerId;

  document.getElementById('contactMsg').textContent = '';

document.getElementById('contactSend').onclick = async () => {
  const text = document.getElementById('contactText').value.trim();
  const msg = document.getElementById('contactMsg');
  if(!text){ msg.textContent = "Bitte eine Nachricht eingeben."; msg.className = "msg err"; return; }
  const { error } = await supabaseClient.from('messages').insert({
    listing_id: contactListingId,
    sender_id: currentUser.id,
    sender_email: currentUser.email,
    empfaenger_id: contactEmpfaengerId,
    nachricht: text
  });
  if(error){ msg.textContent = error.message; msg.className = "msg err"; return; }
  msg.textContent = "Nachricht verschickt!"; msg.className = "msg ok";

};

async function openMessages(){
  const list = document.getElementById('messagesList');
  list.innerHTML = "Lädt…";
  const { data, error } = await supabaseClient
    .from('messages')
    .select('*, listings(marke, modell)')
    .or(`empfaenger_id.eq.${currentUser.id},sender_id.eq.${currentUser.id}`)
    .order('created_at', { ascending: true });

  if(error){ list.innerHTML = `<p class="empty">Fehler: ${error.message}</p>`; openModal('messagesModalBg'); return; }
  if(!data.length){ list.innerHTML = `<p class="empty">Noch keine Nachrichten.</p>`; openModal('messagesModalBg'); return; }

  // Nachrichten zu Konversationen gruppieren: pro Inserat + Gegenüber
  const conversations = {};
  data.forEach(m => {
    const gegenueberId = m.sender_id === currentUser.id ? m.empfaenger_id : m.sender_id;
    const key = `${m.listing_id}__${gegenueberId}`;
    if(!conversations[key]) conversations[key] = { listing: m.listings, gegenueberId, gegenueberEmail: null, listingId: m.listing_id, nachrichten: [] };
    conversations[key].nachrichten.push(m);
    if(m.sender_id !== currentUser.id) conversations[key].gegenueberEmail = m.sender_email;
  });
  Object.values(conversations).forEach(c => { if(!c.gegenueberEmail) c.gegenueberEmail = "diese Person (noch keine Antwort erhalten)"; });

  window._conversationsCache = conversations;

  list.innerHTML = Object.keys(conversations).map(key => {
    const c = conversations[key];
    return `
    <div style="border:1px solid #ddd8cd;padding:12px;">
      <div style="font-size:12px;color:var(--steel);margin-bottom:8px;">
        <strong>${c.listing ? c.listing.marke + ' ' + c.listing.modell : 'Inserat gelöscht'}</strong>
        · Unterhaltung mit ${c.gegenueberEmail}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
        ${c.nachrichten.map(m => `
          <div style="align-self:${m.sender_id === currentUser.id ? 'flex-end' : 'flex-start'};background:${m.sender_id === currentUser.id ? 'var(--accent)' : '#eeeae0'};color:${m.sender_id === currentUser.id ? 'var(--asphalt)' : 'var(--asphalt)'};padding:8px 12px;max-width:80%;font-size:13px;">
            ${m.nachricht.replace(/</g,'&lt;')}
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:6px;">
        <input type="text" id="reply_${key.replace(/[^a-zA-Z0-9]/g,'')}" placeholder="Antworten…" style="flex:1;border:1.5px solid var(--asphalt);padding:8px;font-family:'IBM Plex Sans';font-size:13px;">
        <button class="btn btn-accent" style="padding:8px 14px;font-size:13px;" onclick="sendReply('${key}')">Senden</button>
      </div>
    </div>
  `;}).join('');

  const ungelesenIds = data.filter(m => !m.gelesen && m.empfaenger_id === currentUser.id).map(m => m.id);
  if(ungelesenIds.length){
    await supabaseClient.from('messages').update({ gelesen: true }).in('id', ungelesenIds);
  }

  openModal('messagesModalBg');
}

async function sendReply(key){
  const c = window._conversationsCache[key];
  const inputId = `reply_${key.replace(/[^a-zA-Z0-9]/g,'')}`;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if(!text) return;

  const { error } = await supabaseClient.from('messages').insert({
    listing_id: c.listingId,
    sender_id: currentUser.id,
    sender_email: currentUser.email,
    empfaenger_id: c.gegenueberId,
    nachricht: text
  });
  if(error){ alert("Fehler: " + error.message); return; }
  input.value = '';
  openMessages();
}

async function refreshAuthUI(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  const area = document.getElementById('authArea');
  if(currentUser){
    area.innerHTML = `
      <span>${currentUser.email}</span>
      <button class="btn btn-ghost" onclick="openMessages()">Nachrichten</button>
      <button class="btn btn-ghost" onclick="openMyListings()">Meine Inserate</button>
      <button class="btn btn-accent" onclick="openCreateModal()">Inserieren</button>
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>`;
    document.getElementById('logoutBtn').onclick = async () => {
      await supabaseClient.auth.signOut();
      refreshAuthUI();
    };
  } else {
    area.innerHTML = `<button class="btn btn-accent" onclick="openModal('loginModalBg')">Anmelden zum Inserieren</button>`;
  }
}

  if(!email){ msg.textContent = "Bitte E-Mail eingeben."; msg.className="msg err"; return; }

document.getElementById('otpVerify').onclick = async () => {

  const msg = document.getElementById('otpMsg');
  if(!token){ msg.textContent = "Bitte Code eingeben."; msg.className="msg err"; return; }

async function loadListings(){
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');

  let query = supabaseClient
    .from('listings')
    .select('*')
    .eq('status', 'aktiv');

  const marke = document.getElementById('fil_marke').value;
  const modell = document.getElementById('fil_modell').value;
  const typ = document.getElementById('fil_typ').value;
  const preis = document.getElementById('fil_preis').value;
  const km = document.getElementById('fil_km').value;
  const ort = document.getElementById('fil_ort').value;

  if(marke) query = query.eq('marke', marke);
  if(modell) query = query.eq('modell', modell);
  if(typ) query = query.eq('typ', typ);
  if(preis) query = query.lte('preis', parseFloat(preis));
  if(km) query = query.lte('km', parseInt(km));
  if(ort) query = query.ilike('ort', `%${ort}%`);

  const psVon = document.getElementById('fil_ps_von').value;
  const psBis = document.getElementById('fil_ps_bis').value;
  const gewicht = document.getElementById('fil_gewicht').value;
  const zylinder = document.getElementById('fil_zylinder').value;
  const drehmoment = document.getElementById('fil_drehmoment').value;
  const sitzhoehe = document.getElementById('fil_sitzhoehe').value;
  const antrieb = document.getElementById('fil_antrieb').value;
  const baujahrVon = document.getElementById('fil_baujahr_von').value;
  const baujahrBis = document.getElementById('fil_baujahr_bis').value;
  const fsklasse = document.getElementById('fil_fsklasse').value;
  const verkaeufertyp = document.getElementById('fil_verkaeufertyp').value;
  const nurUnfallfrei = document.getElementById('fil_unfallfrei').checked;
  const nurScheckheft = document.getElementById('fil_scheckheft').checked;

  if(psVon) query = query.gte('ps', parseInt(psVon));
  if(psBis) query = query.lte('ps', parseInt(psBis));
  if(gewicht) query = query.lte('gewicht', parseInt(gewicht));
  if(zylinder) query = query.lte('zylinder', parseInt(zylinder));
  if(drehmoment) query = query.lte('drehmoment', parseInt(drehmoment));
  if(sitzhoehe) query = query.lte('sitzhoehe', parseInt(sitzhoehe));
  if(antrieb) query = query.eq('antriebsart', antrieb);
  if(baujahrVon) query = query.gte('baujahr', parseInt(baujahrVon));
  if(baujahrBis) query = query.lte('baujahr', parseInt(baujahrBis));
  if(fsklasse) query = query.eq('fs_klasse', fsklasse);
  if(verkaeufertyp) query = query.eq('verkaeufer_typ', verkaeufertyp);
  if(nurUnfallfrei) query = query.eq('unfallfrei', true);
  if(nurScheckheft) query = query.eq('scheckheft', true);

  const { data, error } = await query.order('created_at', { ascending: false });

  if(error){ grid.innerHTML = `<p class="empty">Fehler beim Laden: ${error.message}</p>`; return; }
  if(!data.length){ grid.innerHTML = `<p class="empty">Noch keine Inserate — sei der Erste!</p>`; count.textContent = "0 Treffer"; return; }

  count.textContent = `${data.length} Treffer`;
  window._listingsCache = data;
  grid.innerHTML = data.map(b => {
    const bilder = b.bilder && b.bilder.length ? b.bilder : (b.bild_url ? [b.bild_url] : []);
    return `
    <article class="card" onclick="openDetail('${b.id}')">
      <div class="card-media">
        ${bilder.length ? `<img src="${bilder[0]}" alt="${b.marke} ${b.modell}">` : ''}
        ${bilder.length > 1 ? `<span class="photo-count">📷 ${bilder.length}</span>` : ''}
      </div>
      <div class="card-body">
        <h3>${b.marke} ${b.modell}</h3>
        <div class="specs">
          <span>${b.baujahr}</span><span>${b.km.toLocaleString('de-DE')} km</span>
          <span>${b.ccm} ccm</span><span>${b.typ}</span>
        </div>
        <div class="price-row">
          <span class="price">${Number(b.preis).toLocaleString('de-DE')} €</span>
          <span>${b.ort || ''}</span>
        </div>
      </div>
    </article>
  `;}).join('');
}

// ---------- Inserat erstellen / bearbeiten ----------
document.getElementById('insertForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('insertMsg');
  if(!currentUser){ msg.textContent = "Bitte zuerst anmelden."; msg.className="msg err"; return; }

  const files = document.getElementById('f_bild').files;
  let neueBilder = [];
  for(const file of files){
    const path = `${currentUser.id}/${Date.now()}-${file.name}`;
    const { error: uploadErr } = await supabaseClient.storage.from('bike-images').upload(path, file);
    if(uploadErr){ msg.textContent = "Bild-Upload fehlgeschlagen: " + uploadErr.message; msg.className="msg err"; return; }
    const { data: pub } = supabaseClient.storage.from('bike-images').getPublicUrl(path);
    neueBilder.push(pub.publicUrl);
  }

  const payload = {
    marke: document.getElementById('f_marke').value,
    modell: document.getElementById('f_modell').value === '__sonstiges__'
      ? document.getElementById('f_modell_sonstiges').value
      : document.getElementById('f_modell').value,
    typ: document.getElementById('f_typ').value,
    baujahr: parseInt(document.getElementById('f_baujahr').value),
    km: parseInt(document.getElementById('f_km').value),
    ccm: parseInt(document.getElementById('f_ccm').value),
    preis: parseFloat(document.getElementById('f_preis').value),
    ort: document.getElementById('f_ort').value,
    beschreibung: document.getElementById('f_beschreibung').value,
    ps: document.getElementById('f_ps').value ? parseInt(document.getElementById('f_ps').value) : null,
    gewicht: document.getElementById('f_gewicht').value ? parseInt(document.getElementById('f_gewicht').value) : null,
    zylinder: document.getElementById('f_zylinder').value ? parseInt(document.getElementById('f_zylinder').value) : null,
    drehmoment: document.getElementById('f_drehmoment').value ? parseInt(document.getElementById('f_drehmoment').value) : null,
    sitzhoehe: document.getElementById('f_sitzhoehe').value ? parseInt(document.getElementById('f_sitzhoehe').value) : null,
    antriebsart: document.getElementById('f_antriebsart').value || null,
    fs_klasse: document.getElementById('f_fsklasse').value || null,
    verkaeufer_typ: document.getElementById('f_verkaeufertyp').value || null,
    unfallfrei: document.getElementById('f_unfallfrei').checked,
    scheckheft: document.getElementById('f_scheckheft').checked,
  };

  if(editingId){
    if(neueBilder.length){
      const bestehende = (window._listingsCache || []).find(x => x.id === editingId);
      const alteBilder = bestehende && bestehende.bilder && bestehende.bilder.length
        ? bestehende.bilder
        : (bestehende && bestehende.bild_url ? [bestehende.bild_url] : []);
      payload.bilder = [...alteBilder, ...neueBilder];
    }
  } else {
    payload.bilder = neueBilder;
  }

  let error;
  if(editingId){
    ({ error } = await supabaseClient.from('listings').update(payload).eq('id', editingId));
  } else {
    payload.user_id = currentUser.id;
    ({ error } = await supabaseClient.from('listings').insert(payload));
  }

  if(error){ msg.textContent = error.message; msg.className="msg err"; return; }
  msg.textContent = editingId ? "Änderungen gespeichert!" : "Inserat veröffentlicht!";
  msg.className="msg ok";
  document.getElementById('insertForm').reset();
  const wasEditing = editingId;
  editingId = null;
  setTimeout(() => { closeModal('insertModalBg'); loadListings(); if(wasEditing) openMyListings(); }, 800);
});

// ---------- Intelligente Suche (Texterkennung) ----------
function parseSmartSearch(text){
  const t = text.toLowerCase();

  // Filter erstmal komplett zurücksetzen
  document.getElementById('filterForm').reset();
  document.getElementById('extraFilters').querySelectorAll('input,select').forEach(el => {
    if(el.type === 'checkbox') el.checked = false; else el.value = '';
  });

  const marken = ['bmw','ducati','honda','kawasaki','ktm','yamaha','suzuki','triumph','harley-davidson','aprilia','moto guzzi','royal enfield'];
  const gefundeneMarke = marken.find(m => t.includes(m));
  if(gefundeneMarke){
    const select = document.getElementById('fil_marke');
    [...select.options].forEach(o => { if(o.value.toLowerCase() === gefundeneMarke) select.value = o.value; });
  }

  const typen = ['naked bike','reiseenduro','sportler','cruiser','roller'];
  const gefundenerTyp = typen.find(ty => t.includes(ty));
  if(gefundenerTyp){
    const select = document.getElementById('fil_typ');
    [...select.options].forEach(o => { if(o.value.toLowerCase() === gefundenerTyp) select.value = o.value; });
  }

  const psMatch = t.match(/(\d+)\s*ps\b/);
  if(psMatch) document.getElementById('fil_ps_bis').value = psMatch[1];

  const sitzMatch = t.match(/(\d+)\s*(cm|mm)?\s*sitzh/);
  if(sitzMatch){
    let val = parseInt(sitzMatch[1]);
    if(sitzMatch[2] === 'mm') val = Math.round(val / 10);
    document.getElementById('fil_sitzhoehe').value = val;
  }

  const gewichtMatch = t.match(/(\d+)\s*kg\b/);
  if(gewichtMatch) document.getElementById('fil_gewicht').value = gewichtMatch[1];

  const drehmomentMatch = t.match(/(\d+)\s*nm\b/);
  if(drehmomentMatch) document.getElementById('fil_drehmoment').value = drehmomentMatch[1];

  const zylinderMatch = t.match(/(\d+)\s*zylinder/);
  if(zylinderMatch) document.getElementById('fil_zylinder').value = zylinderMatch[1];

  const kmMatch = t.match(/(\d+)\s*km\b/);
  if(kmMatch) document.getElementById('fil_km').value = kmMatch[1];

  const preisMatch = t.match(/(\d+)\s*(€|euro)/);
  if(preisMatch) document.getElementById('fil_preis').value = preisMatch[1];

  const jahrMatch = t.match(/\b(19|20)\d{2}\b/);
  if(jahrMatch){
    document.getElementById('fil_baujahr_von').value = jahrMatch[0];
    document.getElementById('fil_baujahr_bis').value = jahrMatch[0];
  }

  if(t.includes('unfallfrei')) document.getElementById('fil_unfallfrei').checked = true;
  if(t.includes('scheckheft')) document.getElementById('fil_scheckheft').checked = true;

  const antriebe = ['kette','riemen','kardan'];
  const gefundenerAntrieb = antriebe.find(a => t.includes(a));
  if(gefundenerAntrieb){
    const select = document.getElementById('fil_antrieb');
    [...select.options].forEach(o => { if(o.value.toLowerCase() === gefundenerAntrieb) select.value = o.value; });
  }

  document.getElementById('extraFilters').classList.add('open');
  loadListings();
}

document.getElementById('smartSearchBtn').addEventListener('click', () => {
  parseSmartSearch(document.getElementById('smartSearch').value);
});
document.getElementById('smartSearch').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') parseSmartSearch(document.getElementById('smartSearch').value);
});

document.getElementById('fil_search').addEventListener('click', () => loadListings());
document.getElementById('fil_reset').addEventListener('click', () => {
  document.getElementById('filterForm').reset();
  document.getElementById('extraFilters').querySelectorAll('input,select').forEach(el => {
    if(el.type === 'checkbox') el.checked = false; else el.value = '';
  });
  loadListings();
});

refreshAuthUI();
loadListings();
</script>
